# Local mirror of the CI job in .github/workflows/ci.yaml.
#
# Install once per clone:
#   pip install pre-commit && pre-commit install
#
# `pre-commit install` wires up both hook types listed below, so formatting
# runs at commit time and the slower whole-repo checks run at push time.
#
# Why the split: black and isort REWRITE files. At push time that is useless -
# the commits being pushed already contain the unformatted code, so a fix then
# would leave a dirty tree and still push the bad commits. Formatting has to
# happen while the commit is being made. Checks that only ever report, and that
# need to see the whole package rather than the staged subset, belong at push.
default_install_hook_types: [pre-commit, pre-push]

# 3.13 because __init__.py uses the 3.12+ `type X = Y` statement: an older
# interpreter cannot parse the package at all, and flake8 reports E999 on a
# file that is perfectly valid. Home Assistant requires 3.13 itself, so this
# is no extra burden on contributors.
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(custom_components/unifi_play/|tests/|scripts/)
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        files: ^(custom_components/unifi_play/|tests/|scripts/)
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        files: ^(custom_components/unifi_play/|tests/|scripts/)
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # strings.json and translations/en.json are hand-edited and a trailing
      # comma there breaks the config flow's UI text with no other warning.
      - id: check-json
      - id: check-yaml
        files: ^(\.github/workflows/|custom_components/unifi_play/services\.yaml)
      - id: check-merge-conflict

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # The same run CI blocks on, reading .flake8 for its configuration.
        # It is no longer the narrow --select pass: CI stopped running the
        # wider one with --exit-zero, so this has to be the real gate.
        args: [--count, --show-source, --statistics]
        files: ^(custom_components/unifi_play/|tests/|scripts/)
        stages: [pre-push]

  - repo: local
    hooks:
      - id: mqtt-client-calls
        name: MQTT client calls resolve
        # Catches the v1.2.0 failure: a call on the client whose method has
        # been removed. Needs the whole package, so it cannot be a per-file
        # hook, and it is fast enough to run on every push.
        entry: python3.13 scripts/check_mqtt_client_calls.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mqtt-cert-generations
        name: MQTT cert-generation fallback
        # The #21 fallback cannot be caught by the client-call guard and the
        # failure shapes that matter cannot be produced on demand on hardware.
        entry: python3.13 scripts/check_mqtt_cert_generations.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: cert-generation-users
        name: every tls_set uses the bundled cert generations
        # A hardcoded pair cannot reach a device whose CA has rotated, and
        # under TLS 1.3 the rejection is silent (#24).
        entry: python3.13 scripts/check_cert_generation_users.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: coverage-gate
        name: per-module coverage
        # The suite has to run to produce a report, so this is a push-time
        # hook rather than a commit-time one. 95% per module, 100% for the
        # config flow.
        entry: bash -c 'pytest -q --cov --cov-report=json:coverage.json >/dev/null && python3.13 scripts/check_coverage.py coverage.json'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: workflow-injection
        name: no expression reaches a shell script
        # A ${{ }} inside a run: block is text substitution before bash sees
        # the line, so a dispatch input or a tag name becomes source in a job
        # holding a token that can write to this repository.
        entry: python3.13 scripts/check_workflow_injection.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: set-groups-payload
        name: set_groups payload has no firmware-owned keys
        # A zone written with "host" set forms correctly on every device but
        # never carries audio to the members - silent in one room, loud
        # nowhere. Static because the failure needs two speakers to observe.
        entry: python3.13 scripts/check_set_groups_payload.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: quality-scale
        name: quality scale tracker is complete and honest
        # hassfest does not grade a custom integration. A rule marked done
        # with no evidence, or a file that omitted a rule Home Assistant
        # added, would otherwise sit until someone noticed.
        entry: python3.13 scripts/check_quality_scale.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
