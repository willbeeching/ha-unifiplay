name: Feature Request
description: Suggest an idea for the UniFi Play integration
title: "[Feature]: "
labels:
  - enhancement
assignees:
  - willbeeching
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Play device model
      placeholder: e.g. UPL-AMP, UPL-PORT
    validations:
      required: false
