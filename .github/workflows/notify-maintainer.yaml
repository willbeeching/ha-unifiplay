name: Notify maintainer

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Comments on a pull request arrive as issue_comment events, but assigning on
# one needs pull-requests: write - issues: write alone returns 403 "Resource
# not accessible by integration". Without this, every comment a contributor
# left on a PR failed to notify, silently, while issue comments worked fine.
permissions:
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Assign and notify on new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            const maintainer = "willbeeching";

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [maintainer],
              });
            } catch (error) {
              core.warning(`Could not assign ${maintainer}: ${error.message}`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${maintainer} — new issue opened.`,
            });

      - name: Assign and notify on new comments
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            const maintainer = "willbeeching";
            const comment = context.payload.comment;

            if (comment.user.type === "Bot") {
              return;
            }

            if (comment.user.login === maintainer) {
              return;
            }

            // Assignment is the nice-to-have; the notification is the point.
            // These ran in the opposite order once, so a 403 on assign threw
            // before the comment was posted and the maintainer heard nothing
            // at all - the failure mode this whole workflow exists to prevent.
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [maintainer],
              });
            } catch (error) {
              core.warning(`Could not assign ${maintainer}: ${error.message}`);
            }

            if (comment.body.includes(`@${maintainer}`)) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${maintainer} — new comment on this issue.`,
            });
