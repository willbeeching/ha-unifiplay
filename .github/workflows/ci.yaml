name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository. Jobs that need more say so
# themselves; there are none.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA, not a tag. A tag is a moving
# pointer the action's owner can repoint at any time, which is a supply-chain
# write into every job that resolves it. The comment after each SHA records
# which release it was, so Dependabot's bumps stay reviewable.
env:
  # The Python the pinned Home Assistant release requires. Stated once so
  # every job reads the same value.
  PYTHON: "3.14"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test*.txt

      - name: Install tooling
        run: pip install -r requirements_test.txt

      - name: Black
        run: black --check --diff custom_components/unifi_play/ tests/ scripts/

      - name: isort
        run: isort --check-only --diff custom_components/unifi_play/ tests/ scripts/

      - name: Ruff
        run: ruff check custom_components/unifi_play/ tests/ scripts/

      # Kept alongside Ruff rather than replaced by it: the two disagree often
      # enough to be worth both, and this one now exits non-zero instead of
      # the advisory --exit-zero pass it replaces.
      - name: flake8
        run: flake8 custom_components/unifi_play/ tests/ scripts/

      # A ${{ }} inside a run: block is text substitution before bash parses
      # the line, so a dispatch input or a branch name becomes source. The
      # release workflow is the one holding a token that can write here.
      - name: No expression reaches a shell script
        run: python scripts/check_workflow_injection.py

      # The tracker is a self-assessment. A missing pinned official rule,
      # a done with no evidence, or a brands claim without the files
      # would otherwise sit until someone noticed. Needs PyYAML, same as
      # the workflow-injection check above. New Home Assistant rules are
      # the scheduled quality-scale-upstream job, not this one.
      - name: Quality scale tracker
        run: python scripts/check_quality_scale.py

  protocol-guards:
    name: Protocol guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON }}

      # flake8 catches undefined names, never a missing attribute on an object
      # it cannot type - which is how v1.2.0 shipped calling two methods that
      # no longer existed (#13).
      - name: MQTT client calls resolve
        run: python scripts/check_mqtt_client_calls.py

      # Control flow in connect(), not a missing method: the client-call guard
      # cannot see it, and the failure shapes cannot be produced on demand
      # against hardware.
      - name: MQTT cert-generation fallback
        run: python scripts/check_mqtt_cert_generations.py

      # A zone written with "host" set forms on every device and then plays in
      # one room only (#22). The failure needs two speakers to observe, so
      # nothing here can catch it dynamically.
      - name: set_groups payload
        run: python scripts/check_set_groups_payload.py

      # The cert-generation fallback shipped in mqtt_client only; discovery
      # built its own paho client with the 2023 pair hardcoded, so an Audio
      # Port on rotated firmware could not be set up at all (#24).
      - name: Cert-generation call sites
        run: python scripts/check_cert_generation_users.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test*.txt

      # One lane: the floor declared in hacs.json is the current stable
      # release, so the release under test is both the newest and the oldest
      # this integration supports.
      - name: Install dependencies
        run: pip install -r requirements_test_latest.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=json:coverage.json

      # 95% for every module and 100% for the config flow, enforced per
      # module rather than as one repository-wide number: 95% overall is
      # comfortably reachable with the largest and most branch-heavy file
      # barely touched.
      - name: Per-module coverage gate
        run: python scripts/check_coverage.py coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test*.txt

      # Against the real Home Assistant package, not stubs: the point is to
      # catch a signature that changed under us, and a stub tracks whatever
      # was true when it was written.
      - name: Install dependencies
        run: pip install -r requirements_test_latest.txt

      - name: mypy
        run: mypy custom_components/unifi_play

  import-smoke:
    name: Import smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test*.txt

      - name: Install dependencies
        run: pip install -r requirements_test_latest.txt

      # Imports every module and asserts the floor declared in hacs.json is
      # the release actually being tested. A Dependabot bump to
      # requirements_test_latest.txt fails here until hacs.json moves with it.
      - name: Import and version consistency
        run: python scripts/check_min_ha_version.py

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # 2026-10-16
