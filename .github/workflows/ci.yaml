name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check code formatting with Black
        run: |
          black --check custom_components/unifi_play/

      - name: Check import sorting with isort
        run: |
          isort --check-only custom_components/unifi_play/

      - name: Lint with flake8
        run: |
          flake8 custom_components/unifi_play/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 custom_components/unifi_play/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # flake8's selection above catches undefined names, never a missing
      # attribute on an object it cannot type - which is how v1.2.0 shipped
      # calling two methods that no longer existed (#13).
      - name: Check MQTT client calls resolve
        run: |
          python scripts/check_mqtt_client_calls.py

      # Control flow in connect(), not a missing method: the client-call
      # guard cannot see it, and the failure shapes cannot be produced on
      # demand against hardware.
      - name: Check MQTT cert-generation fallback
        run: |
          python scripts/check_mqtt_cert_generations.py

      # A zone written with "host" set forms on every device and then plays
      # in one room only (#22). The failure needs two speakers to observe, so
      # nothing here can catch it dynamically - and a pre-push hook alone
      # misses anyone without hooks installed, or an edit made in the web UI.
      - name: Check set_groups payload
        run: |
          python scripts/check_set_groups_payload.py

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
