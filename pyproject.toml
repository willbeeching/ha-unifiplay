[tool.isort]
profile = "black"
known_first_party = ["custom_components.unifi_play", "tests"]
forced_separate = ["tests"]
# Deliberately NOT combine_as_imports: Home Assistant core uses it, but
# turning it on here rewrites import blocks in files no change has touched,
# which buries the actual change under noise.

[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "PGH",   # pygrep-hooks (bans bare "type: ignore")
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    # Black owns formatting; E501 duplicates it and disagrees on comments
    # that the repository deliberately writes long.
    "E501",
    # Renaming MqttCertificateRejected and friends to ...Error would touch
    # every call site and every log line for a naming convention, and the
    # names are already unambiguous.
    "N818",
    # The nested `if`s here have comments between them explaining each
    # condition separately. Collapsing them collapses the reasoning too,
    # which is this repository's main defence against a later "simplify".
    "SIM102",
    # `try: ... except X: pass` reads more plainly than contextlib.suppress
    # in the cleanup paths, where the point is that the failure is expected.
    "SIM105",
    # Reordering an assertion to put the literal first makes it read worse.
    "SIM300",
    # `[*a, b]` over `a + [b]` is a preference, and applying it would edit
    # zone code that PR4 rewrites anyway.
    "RUF005",
    # Home Assistant's own entity classes declare `_attr_options` and friends
    # as plain lists; ClassVar there would fight the framework.
    "RUF012",
    # The protocol guards deliberately keep a version check that is still
    # true for the interpreters people actually run them on.
    "UP036",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers and build deliberately odd payloads.
"tests/*" = ["SLF001"]
# The protocol guards walk the AST and print a report; that is their job.
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.unifi_play", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --strict-markers --strict-config"
# A warning from this integration is a defect, and an unraisable exception
# (a callback throwing on a paho thread, a task dying unobserved) is exactly
# the failure mode the pre-test-suite code shipped twice. Everything the
# integration itself can emit is an error; third-party deprecations that no
# change here can fix are listed individually so a new one still fails.
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:Inheritance class .* from ClientSession is discouraged:DeprecationWarning",
    "ignore:Accessing the 'model_fields' attribute:DeprecationWarning",
    # Raised by aiohttp inside Home Assistant's own http component, which
    # still writes app["hass"]. Nothing in this repository can fix it, and it
    # only appears on the older releases in the minimum lane.
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
]

[tool.coverage.run]
source = ["custom_components/unifi_play"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
]
show_missing = true

[tool.mypy]
python_version = "3.13"
plugins = []
follow_imports = "normal"
local_partial_types = true
strict = true
# HA's own settings for custom integrations. Untyped third-party stubs would
# otherwise silence real errors in our own code.
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Home Assistant re-exports names through package __init__ files without
# listing them in __all__, so no_implicit_reexport - which is right for this
# integration's own modules - reports its imports as private. The rule stays
# on for everything written here.
module = "homeassistant.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# paho-mqtt ships no py.typed marker, so every call into it is Any. The
# integration's own wrappers around it are still checked; this only stops
# mypy refusing to import the module.
module = "paho.mqtt.*"
ignore_missing_imports = true
implicit_reexport = true

# The test suite is deliberately outside mypy's remit: fixtures are partial by
# design and assertions reach for private attributes, so strict mode there
# would be a second, weaker type system arguing with the first. Ruff and
# flake8 still cover tests/.
